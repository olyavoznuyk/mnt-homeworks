---
apiVersion: v1
kind: Pod
metadata:
  name: netology-app
spec:
  containers:
  - name: echoserver
    image: gcr.io/kubernetes-e2e-test-images/echoserver:2.2
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: netology-svc
spec:
  type: ClusterIP
  selector:
    app: netology-app
  ports:
  - protocol: TCP
    port: 8881  
    targetPort: 8080
