apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-multitool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-multitool
  template:
    metadata:
      labels:
        app: busybox-multitool
    spec:
      volumes:
        - name: shared-data
          emptyDir: {}
      containers:
        - name: busybox
          image: busybox
          command:
            - sh
            - -c
            - |
              while true; do
                echo "Current timestamp: $(date)" >> /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool
          command:
            - sh
            - -c
            - |
              # Выводим содержимое файла каждые 5 секунд
              while true; do
                echo "=== Contents of /shared/data.txt ==="
                cat /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: shared-data
              mountPath: /shared
